<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Board</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header>
      <div>
        <p class="kicker">Hábitos · 7 días</p>
        <h1>Habit Board</h1>
      </div>
      <form id="addForm">
        <input id="habitInput" type="text" placeholder="Nuevo hábito…" maxlength="40" required />
        <button type="submit">Añadir</button>
      </form>
    </header>

    <div class="board-wrap">
      <table class="board" id="board">
        <thead>
          <tr>
            <th>Hábito</th>
            <th>L</th><th>M</th><th>X</th><th>J</th><th>V</th><th>S</th><th>D</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="hint">Los datos se guardan en tu navegador (localStorage).</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
